        The page scrolls the way any page does.
        It owned a bounded scroll region until 25 August, so that a pinned Talk

        HOST scrolls, which no fixed element inside can survive. The card is
        gone at Karynn's word, and the constraint went with it rather than
        outliving its reason: what it costs is real estate, letterboxing the
        prototype into part of the window for a benefit nothing now collects.
      */
